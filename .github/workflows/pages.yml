name: Build CV and deploy site

on:
  push:
    branches: [main]
    paths: ["Flavio_Gualtieri_CV.tex", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Flavio_Gualtieri_CV.tex

      - name: Render preview image
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pdftoppm -png -r 150 -singlefile Flavio_Gualtieri_CV.pdf preview

      - name: Assemble site
        run: |
          mkdir -p _site
          cp Flavio_Gualtieri_CV.pdf preview.png _site/
          sed "s/__BUILD_DATE__/$(date -u +'%-d %b %Y')/" site/index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
